<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="dgad DMG waveform icon">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2ECDB"/>
      <stop offset="0.45" stop-color="#D8D0BC"/>
      <stop offset="0.8" stop-color="#B3AB98"/>
      <stop offset="1" stop-color="#8F8776"/>
    </linearGradient>
    <linearGradient id="chassisEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="0.08" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123324"/>
      <stop offset="0.5" stop-color="#0A1D13"/>
      <stop offset="1" stop-color="#050F0A"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#1E6B3C" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#0E3A22" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="btnMagenta" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#F27BA4"/>
      <stop offset="0.35" stop-color="#D14A7C"/>
      <stop offset="0.75" stop-color="#8E1F4B"/>
      <stop offset="1" stop-color="#5E1230"/>
    </radialGradient>
    <linearGradient id="dpadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4E57"/>
      <stop offset="0.5" stop-color="#26282E"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B6E77"/>
      <stop offset="0.5" stop-color="#3A3D44"/>
      <stop offset="1" stop-color="#1B1C20"/>
    </linearGradient>
    <filter id="traceGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <pattern id="scanlines" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="2" fill="#000000" opacity="0.28"/>
    </pattern>
    <pattern id="dotgrid" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#2E7D4F" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- app frame -->
  <rect x="2" y="2" width="252" height="252" rx="54" fill="#1C1B18"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="url(#chassis)"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="url(#chassisEdge)"/>
  <!-- top highlight -->
  <rect x="20" y="10" width="216" height="22" rx="11" fill="#FFFFFF" opacity="0.35"/>

  <!-- screen bezel -->
  <rect x="24" y="28" width="208" height="118" rx="14" fill="#2B2E36" filter="url(#softShadow)"/>
  <rect x="24" y="28" width="208" height="118" rx="14" fill="none" stroke="#14151A" stroke-width="2" opacity="0.8"/>
  <rect x="30" y="34" width="196" height="106" rx="9" fill="#0B0C0E"/>
  <!-- screen -->
  <rect x="38" y="42" width="180" height="90" rx="4" fill="url(#screenGlass)"/>
  <rect x="38" y="42" width="180" height="90" rx="4" fill="url(#screenGlow)"/>
  <rect x="38" y="42" width="180" height="90" rx="4" fill="url(#dotgrid)"/>
  <!-- grid -->
  <g stroke="#2E7D4F" stroke-width="1" opacity="0.45">
    <line x1="38" y1="64" x2="218" y2="64"/>
    <line x1="38" y1="87" x2="218" y2="87"/>
    <line x1="38" y1="110" x2="218" y2="110"/>
    <line x1="74" y1="42" x2="74" y2="132"/>
    <line x1="110" y1="42" x2="110" y2="132"/>
    <line x1="146" y1="42" x2="146" y2="132"/>
    <line x1="182" y1="42" x2="182" y2="132"/>
  </g>
  <!-- multi-channel waveforms -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#traceGlow)">
    <path d="M42,104 L62,104 L62,94 L82,94 L82,104 L102,104 L102,94 L122,94 L122,104 L142,104 L142,94 L162,94 L162,104 L182,104 L182,94 L202,94 L202,104 L214,104"
          stroke="#FFE14D" stroke-width="1.6" opacity="0.55"/>
    <path d="M42,88 C52,64 64,64 74,88 S94,112 104,88 S124,64 134,88 S154,112 164,88 S184,64 194,88 S206,98 214,84"
          stroke="#33E8FF" stroke-width="2.4" opacity="0.95"/>
    <path d="M42,96 L58,96 L58,70 L82,70 L82,96 L98,96 L98,70 L122,70 L122,96 L138,96 L138,70 L162,70 L162,96 L178,96 L178,70 L202,70 L202,96 L214,96"
          stroke="#3DFF7A" stroke-width="2.6"/>
  </g>
  <!-- scanlines + glass reflection -->
  <rect x="38" y="42" width="180" height="90" rx="4" fill="url(#scanlines)"/>
  <polygon points="38,42 110,42 70,132 38,132" fill="#FFFFFF" opacity="0.07"/>
  <polygon points="120,42 135,42 95,132 82,132" fill="#FFFFFF" opacity="0.05"/>

  <!-- power LED + labels -->
  <circle cx="32" cy="92" r="3.2" fill="#FF3B30" filter="url(#traceGlow)"/>
  <circle cx="32" cy="92" r="1.4" fill="#FFD0CC"/>
  <text x="128" y="39" text-anchor="middle" font-family="monospace, sans-serif" font-size="8.5" letter-spacing="2" fill="#5A5347">DGAD • DMG AUDIO DBG</text>

  <!-- controls -->
  <!-- D-pad -->
  <g filter="url(#softShadow)">
    <rect x="46" y="164" width="52" height="18" rx="4" fill="url(#dpadGrad)"/>
    <rect x="63" y="147" width="18" height="52" rx="4" fill="url(#dpadGrad)"/>
    <rect x="63" y="147" width="18" height="52" rx="4" fill="none" stroke="#0C0D10" stroke-width="1.5"/>
    <rect x="46" y="164" width="52" height="18" rx="4" fill="none" stroke="#0C0D10" stroke-width="1.5"/>
    <circle cx="72" cy="173" r="6" fill="#17181C"/>
    <circle cx="72" cy="173" r="2.2" fill="#3C3F47"/>
  </g>
  <!-- select / start -->
  <g>
    <rect x="108" y="176" width="26" height="8" rx="4" fill="url(#pillGrad)" transform="rotate(-18 121 180)"/>
    <rect x="138" y="176" width="26" height="8" rx="4" fill="url(#pillGrad)" transform="rotate(-18 151 180)"/>
    <text x="113" y="196" font-family="monospace, sans-serif" font-size="7" fill="#6B6455" transform="rotate(-18 113 196)">SELECT</text>
    <text x="143" y="196" font-family="monospace, sans-serif" font-size="7" fill="#6B6455" transform="rotate(-18 143 196)">START</text>
  </g>
  <!-- A / B -->
  <g filter="url(#softShadow)">
    <circle cx="186" cy="180" r="14" fill="#7A2438"/>
    <circle cx="186" cy="180" r="11.5" fill="url(#btnMagenta)"/>
    <circle cx="182.5" cy="176" r="3.5" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="214" cy="166" r="14" fill="#7A2438"/>
    <circle cx="214" cy="166" r="11.5" fill="url(#btnMagenta)"/>
    <circle cx="210.5" cy="162" r="3.5" fill="#FFFFFF" opacity="0.45"/>
    <text x="186" y="202" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6B2133">B</text>
    <text x="214" y="188" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#6B2133">A</text>
  </g>
  <!-- speaker grille -->
  <g fill="#4A4438" opacity="0.9">
    <circle cx="150" cy="214" r="3"/><circle cx="162" cy="214" r="3"/><circle cx="174" cy="214" r="3"/><circle cx="186" cy="214" r="3"/><circle cx="198" cy="214" r="3"/><circle cx="210" cy="214" r="3"/>
    <circle cx="156" cy="224" r="3"/><circle cx="168" cy="224" r="3"/><circle cx="180" cy="224" r="3"/><circle cx="192" cy="224" r="3"/><circle cx="204" cy="224" r="3"/><circle cx="216" cy="224" r="3"/>
    <circle cx="162" cy="234" r="3"/><circle cx="174" cy="234" r="3"/><circle cx="186" cy="234" r="3"/><circle cx="198" cy="234" r="3"/><circle cx="210" cy="234" r="3"/>
  </g>
  <!-- channel strip ticks -->
  <g font-family="monospace, sans-serif" font-size="7" fill="#6B6455">
    <text x="40" y="216">PU1</text><text x="40" y="226">PU2</text><text x="40" y="236">WAV</text><text x="70" y="236">NOISE</text>
  </g>
  <g>
    <rect x="38" y="240" width="72" height="5" rx="2.5" fill="#2A2721"/>
    <rect x="38" y="240" width="52" height="5" rx="2.5" fill="#3DFF7A"/>
  </g>
</svg>
